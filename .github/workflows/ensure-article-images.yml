name: Ensure Article Images

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ensure-article-images
  cancel-in-progress: false

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Pillow
        run: python -m pip install --upgrade Pillow

      - name: Generate missing article covers
        run: python scripts/ensure_images.py

      - name: Verify every article has a unique local cover
        run: python scripts/verify_images.py --strict

      - name: Commit generated covers
        run: |
          git config user.name "TechPulse Image Bot"
          git config user.email "techpulse@users.noreply.github.com"
          git add content/posts static/images
          if git diff --cached --quiet; then
            echo "All article covers were already present."
          else
            git commit -m "chore: backfill missing article covers [skip ci]"
            git push
          fi
