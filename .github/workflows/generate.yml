name: Generate Articles
on:
  schedule:
    - cron: '0 8,14,20 * * *'  # 3x daily: 8am, 2pm, 8pm UTC
  workflow_dispatch:
    inputs:
      num_articles:
        description: 'Number of articles to generate'
        required: false
        default: '5'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install groq

      - name: Generate articles
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NUM_ARTICLES: ${{ github.event.inputs.num_articles || '3' }}
          BLOG_AUTHOR: ${{ vars.BLOG_AUTHOR || 'Tech Tutorials Hub' }}
        run: python scripts/generate.py

      - name: Commit new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/
          if git diff --cached --quiet; then
            echo "No new articles to commit"
          else
            git commit -m "docs: auto-generate $(date +%Y-%m-%d) articles [skip ci]"
            git push
          fi
