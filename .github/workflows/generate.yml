name: Generate Articles

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-articles
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --quiet groq pillow

      - name: Check required API credential
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "GROQ_API_KEY is not configured in repository Actions secrets. No articles were generated or published."
            exit 1
          fi

      - name: Generate three tech articles and covers
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          NUM_ARTICLES: "3"
          BLOG_AUTHOR: "TechPulse"
        run: python scripts/generate.py

      - name: Require exactly three complete articles with unique verified covers
        run: |
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          from PIL import Image
          from PIL.ExifTags import TAGS

          summary = json.loads(Path("generation-summary.json").read_text(encoding="utf-8"))
          if len(summary) != 3:
              raise SystemExit(f"Expected 3 complete articles; generator produced {len(summary)}. Nothing will be published.")

          seen_hashes = set()
          for item in summary:
              article = Path(item["file"])
              if not article.is_file():
                  raise SystemExit(f"Missing article file: {article}")
              text = article.read_text(encoding="utf-8")
              match = re.search(r'(?m)^image:\s*"(/images/[^"\n]+)"\s*$', text)
              if not match:
                  raise SystemExit(f"Article has no local cover reference: {article}")
              image = Path("static") / match.group(1).lstrip("/")
              if not image.is_file():
                  raise SystemExit(f"Missing cover image: {image}")
              with Image.open(image) as im:
                  if im.format != "JPEG" or im.size != (800, 450):
                      raise SystemExit(f"Cover must be an 800x450 JPEG: {image}")
                  exif = im.getexif()
                  make = next((str(v).strip().lower() for k, v in exif.items() if TAGS.get(k) == "Make"), "")
                  if make != "sana":
                      raise SystemExit(f"Cover is not verified as generated by the configured image provider: {image}")
              digest = hashlib.sha256(image.read_bytes()).hexdigest()
              if digest in seen_hashes:
                  raise SystemExit(f"Duplicate cover in today's articles: {image}")
              seen_hashes.add(digest)
              print(f"Validated: {item['title']} — {article} — {image}")
          PY

      - name: Publish articles to main
        run: |
          git config user.name "TechPulse Bot"
          git config user.email "techpulse@users.noreply.github.com"
          git add content/posts/ static/images/
          if git diff --cached --quiet; then
            echo "No new articles or covers to publish."
            exit 1
          fi
          git commit -m "chore: publish three daily tech articles [skip ci]"
          git push origin HEAD:main
