name: Marketing Automation
on:
  schedule:
    - cron: '0 9,15,21 * * *'  # 3x daily, 1hr after article generation
  workflow_dispatch:

permissions:
  contents: write   # needed to commit the dedup registry back to the repo

concurrency:
  group: marketing-post
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      # ---- Telegram (free, unlimited, best reach) ----
      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "Telegram not set, skipping"; exit 0; fi
          LATEST=$(python scripts/mark_done.py next telegram) || { echo "All articles already posted to Telegram"; exit 0; }
          [ -z "$LATEST" ] && exit 0
          SLUG=$(basename "$LATEST" .md)
          IMG=$(grep "^image:" "$LATEST" | head -1 | sed 's/image: "//' | sed 's/"$//')
          TEASER=$(python scripts/teaser.py "$LATEST")
          MSG=$(echo "$TEASER" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g')
          case "$IMG" in
            /*) IMG="https://tech-blog-eight-blush.vercel.app${IMG}" ;;
          esac
          if [ -n "$IMG" ]; then
            RESP=$(curl -sS --max-time 60 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto" \
              -F chat_id="${TELEGRAM_CHANNEL_ID}" \
              -F photo="$IMG" \
              -F caption="$MSG" \
              -F parse_mode="HTML") || true
            echo "sendPhoto: $RESP"
          fi
          RESP2=$(curl -sS --max-time 60 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHANNEL_ID}" \
            -d text="$MSG" -d parse_mode="HTML") || true
          echo "sendMessage: $RESP2"
          if echo "$RESP$RESP2" | grep -q '"ok":true'; then
            python scripts/mark_done.py post telegram "$SLUG"
            echo "Telegram done"
          else
            echo "Telegram did not confirm (will retry next run)"
          fi

      # ---- Reddit (free, 100 req/min) ----
      - name: Post to Reddit
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_SECRET: ${{ secrets.REDDIT_SECRET }}
          REDDIT_USERNAME: ${{ secrets.REDDIT_USERNAME }}
          REDDIT_PASSWORD: ${{ secrets.REDDIT_PASSWORD }}
        run: |
          if [ -z "$REDDIT_CLIENT_ID" ]; then echo "Reddit key not set, skipping"; exit 0; fi
          LATEST=$(python scripts/mark_done.py next reddit) || { echo "All articles already posted to Reddit"; exit 0; }
          [ -z "$LATEST" ] && exit 0
          SLUG=$(basename "$LATEST" .md)
          TITLE=$(grep "^title:" "$LATEST" | head -1 | sed 's/title: "//' | sed 's/"$//')
          URL="https://tech-blog-eight-blush.vercel.app/posts/${SLUG}/"
          CAT=$(sed -n 's/^categories: \[\(.*\)\]/\1/p' "$LATEST")
          case "$CAT" in
            *AI*) SUB="artificial" ;;
            *Crypto*) SUB="CryptoCurrency" ;;
            *Programming*) SUB="programming" ;;
            *Space*) SUB="space" ;;
            *) SUB="technology" ;;
          esac
          echo "Posting to r/$SUB"
          python scripts/reddit_post.py "$SUB" "$TITLE" "$URL" && \
            python scripts/mark_done.py post reddit "$SLUG"

      # ---- Dev.to (free, unlimited) ----
      - name: Cross-post to Dev.to
        env:
          DEVTO_API_KEY: ${{ secrets.DEVTO_API_KEY }}
        run: |
          if [ -z "$DEVTO_API_KEY" ]; then echo "Dev.to key not set, skipping"; exit 0; fi
          LATEST=$(python scripts/mark_done.py next devto) || { echo "All articles already posted to Dev.to"; exit 0; }
          [ -z "$LATEST" ] && exit 0
          SLUG=$(basename "$LATEST" .md)
          python scripts/devto_post.py "$LATEST" && \
            python scripts/mark_done.py post devto "$SLUG"

      # ---- Discord (0-cost: webhook URL, no OAuth/approval) ----
      - name: Post to Discord
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then echo "Discord webhook not set, skipping"; exit 0; fi
          LATEST=$(python scripts/mark_done.py next discord) || { echo "All articles already posted to Discord"; exit 0; }
          [ -z "$LATEST" ] && exit 0
          SLUG=$(basename "$LATEST" .md)
          TEASER=$(python scripts/teaser.py "$LATEST")
          python scripts/discord_post.py "$TEASER" && \
            python scripts/mark_done.py post discord "$SLUG"

      - name: Post to Bluesky
        env:
          BSKY_HANDLE: ${{ secrets.BSKY_HANDLE }}
          BSKY_PASSWORD: ${{ secrets.BSKY_PASSWORD }}
        run: |
          if [ -z "$BSKY_HANDLE" ]; then echo "Bluesky not set, skipping"; exit 0; fi
          LATEST=$(python scripts/mark_done.py next bluesky) || { echo "All articles already posted to Bluesky"; exit 0; }
          [ -z "$LATEST" ] && exit 0
          SLUG=$(basename "$LATEST" .md)
          TEASER=$(python scripts/teaser.py "$LATEST")
          python scripts/bluesky_post.py "$TEASER" && \
            python scripts/mark_done.py post bluesky "$SLUG"

      - name: Post to Mastodon
        env:
          MASTODON_INSTANCE: ${{ secrets.MASTODON_INSTANCE }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
        run: |
          if [ -z "$MASTODON_TOKEN" ]; then echo "Mastodon not set, skipping"; exit 0; fi
          LATEST=$(python scripts/mark_done.py next mastodon) || { echo "All articles already posted to Mastodon"; exit 0; }
          [ -z "$LATEST" ] && exit 0
          SLUG=$(basename "$LATEST" .md)
          TEASER=$(python scripts/teaser.py "$LATEST")
          python scripts/mastodon_post.py "$TEASER" && \
            python scripts/mark_done.py post mastodon "$SLUG"

      # ---- Commit the dedup registry back to the repo so it persists ----
      - name: Commit posting registry
        run: |
          git config user.name "TechPulse Bot"
          git config user.email "techpulse@users.noreply.github.com"
          git add .marketing || true
          if git diff --cached --quiet; then
            echo "No registry changes to commit"
          else
            git commit -m "chore: update posting registry [skip ci]" || true
            GIT_TERMINAL_PROMPT=0 git push || echo "push failed"
          fi

      # ---- SEO pings (always free, no auth) ----
      - name: Ping Google & Bing
        run: |
          curl -s "https://www.google.com/ping?sitemap=https://tech-blog-eight-blush.vercel.app/sitemap.xml" > /dev/null || true
          curl -s "https://www.bing.com/indexnow?url=https://tech-blog-eight-blush.vercel.app/sitemap.xml" > /dev/null || true
          echo "Search engines notified"