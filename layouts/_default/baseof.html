<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ if .IsHome }}{{ .Site.Title }} — Daily Tech News{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
    <meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta name="keywords" content="{{ with .Params.tags }}{{ delimit . ", " }}{{ else }}tech news, AI, startups, programming, crypto{{ end }}">
    <meta name="author" content="{{ .Site.Params.author }}">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#050505">
    <meta property="og:title" content="{{ .Title }}">
    <meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
    <meta property="og:type" content="{{ if .IsPage }}article{{ else }}website{{ end }}">
    <meta property="og:url" content="{{ .Permalink }}">
    <meta property="og:site_name" content="{{ .Site.Title }}">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="canonical" href="{{ .Permalink }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "{{ .Site.Title }}",
        "url": "{{ .Site.BaseURL }}",
        "description": "{{ .Site.Params.description }}"
    }
    </script>
    {{ if .IsPage }}
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "TechArticle",
        "headline": "{{ .Title }}",
        "description": "{{ .Description }}",
        "author": { "@type": "Person", "name": "{{ with .Params.author }}{{ . }}{{ else }}{{ .Site.Params.author }}{{ end }}" },
        "datePublished": "{{ .Date.Format "2006-01-02" }}",
        "dateModified": "{{ .Lastmod.Format "2006-01-02" }}"
    }
    </script>
    {{ end }}
</head>
<body>
    {{ partial "bg.html" . }}

    {{ partial "nav.html" . }}

    <main>
        {{ block "main" . }}{{ end }}
    </main>

    {{ partial "footer.html" . }}

    <script>
    // ===== Image fade-in + fallback (never show a broken icon) =====
    function loadedImg(img) { img.classList.add("loaded"); }
    function fallbackImg(img) {
        if (img.dataset.failed) return;
        img.dataset.failed = "1";
        img.style.display = "none";  // hide — never swap to a non-Pollinations image
    }
    function initImgs() {
        document.querySelectorAll("img[loading=lazy], img.card-img, img.qbg, .article-hero img").forEach(function (img) {
            if (img.complete && img.naturalWidth > 0) loadedImg(img);
            else if (img.complete) fallbackImg(img);
            else {
                img.addEventListener("load", function () { loadedImg(img); });
                img.addEventListener("error", function () { fallbackImg(img); });
            }
        });
    }
    document.addEventListener("error", function (e) {
        var t = e.target;
        if (t && t.tagName === "IMG" && !t.dataset.fallbackHandled) {
            t.dataset.fallbackHandled = "1";
            fallbackImg(t);
        }
    }, true);

    // ===== Scroll reveal (lightweight, Framer-Motion feel) =====
    function initReveal() {
        var els = document.querySelectorAll(".reveal, .reveal-stagger > *");
        if (!("IntersectionObserver" in window)) {
            els.forEach(function (el) { el.classList.add("is-visible", "revealed"); });
            return;
        }
        var io = new IntersectionObserver(function (entries) {
            entries.forEach(function (en) {
                if (en.isIntersecting) {
                    en.target.classList.add("is-visible", "revealed");
                    io.unobserve(en.target);
                }
            });
        }, { threshold: 0.08, rootMargin: "0px 0px -40px 0px" });
        els.forEach(function (el) { io.observe(el); });
    }

    // ===== Mobile nav toggle =====
    function initNav() {
        var btn = document.querySelector("[data-nav-toggle]");
        var nav = document.querySelector(".nav");
        if (!btn || !nav) return;
        btn.addEventListener("click", function () {
            var open = nav.classList.toggle("open");
            btn.setAttribute("aria-expanded", open ? "true" : "false");
        });
    }

    if (document.readyState !== "loading") {
        initImgs(); initReveal(); initNav();
    } else {
        document.addEventListener("DOMContentLoaded", function () {
            initImgs(); initReveal(); initNav();
        });
    }
    </script>
</body>
</html>
