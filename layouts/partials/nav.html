{{/* ===== Floating pill navigation ===== */}}
{{ $current := . }}{{/* . not used directly here; each link compares its URL */}}
<header class="site-header">
    <nav class="nav" role="navigation" aria-label="Main navigation">
        <a href="/" class="nav-logo" aria-label="TechPulse home">Tech<em>Pulse</em></a>
        <div class="nav-links" id="navLinks">
            {{ range .Site.Menus.main }}
            <a href="{{ .URL }}" class="{{ if $.IsMenuCurrent "main" . }}active{{ end }}">{{ .Name }}</a>
            {{ end }}
        </div>
        <div class="nav-actions">
            <button class="nav-search" aria-label="Search" data-search-toggle>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            </button>
            <button class="btn-nav">Subscribe</button>
            <button class="btn-burger" aria-label="Toggle menu" aria-expanded="false" data-nav-toggle>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="7" x2="21" y2="7"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="17" x2="21" y2="17"/></svg>
            </button>
        </div>
    </nav>
</header>
