{{/* AdSense unit. Renders only when both a publisher ID and a slot ID are set. */}}
{{ $client := site.Params.adsensePublisher }}
{{ $slot := .slot | default "" }}
{{ $class := .class | default "" }}
{{ if and $client $slot }}
<aside class="ad-unit {{ $class }}" aria-label="Advertisement">
    <span class="ad-label">Advertisement</span>
    <ins class="adsbygoogle"
         style="display:block"
         data-ad-client="{{ $client }}"
         data-ad-slot="{{ $slot }}"
         data-ad-format="auto"
         data-full-width-responsive="true"></ins>
</aside>
{{ end }}
