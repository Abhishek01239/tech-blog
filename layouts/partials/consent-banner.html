{{/* Cookie consent notice. Shown until the visitor makes a choice. */}}
{{ with site.Params.adsensePublisher }}
<div id="tp-consent" class="tp-consent" role="dialog" aria-live="polite" aria-label="Cookie consent" hidden>
    <p class="tp-consent-text">
        We use cookies to measure traffic and, with your consent, to show ads through Google AdSense.
        See our <a href="/privacy/">Privacy Policy</a> for details.
    </p>
    <div class="tp-consent-actions">
        <button type="button" class="tp-consent-btn tp-consent-accept" data-consent="granted">Accept</button>
        <button type="button" class="tp-consent-btn tp-consent-reject" data-consent="denied">Reject</button>
    </div>
</div>
{{ end }}
