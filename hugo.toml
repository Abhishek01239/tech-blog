baseURL = "https://www.nexivo.org.in/"
languageCode = "en-us"
title = "TechPulse"
enableRobotsTXT = true

# Categories only. Tag pages were removed: 374 of 469 tags held a single post,
# which added hundreds of near-empty pages for crawlers to index.
[taxonomies]
  category = "categories"

[params]
  description = "Independent analysis of AI, cybersecurity, and the infrastructure behind them."
  author = "TechPulse"
  github_repo = "https://github.com/Abhishek01239/tech-blog"
  contactEmail = "jaiswarabhishek12@gmail.com"
  # Google AdSense publisher ID, used for the verification meta tag and ads.txt.
  adsensePublisher = "ca-pub-1455389319625277"
  # Ad unit IDs from AdSense > Ads > By ad unit. Leave empty until units exist;
  # ad slots render nothing while empty, so no empty boxes appear on the site.
  adsenseSlotArticle = "5005825680"
  adsenseSlotSidebar = "2950507980"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "AI"
  url = "/categories/ai/"
  weight = 2

[[menu.main]]
  name = "Cybersecurity"
  url = "/categories/cybersecurity/"
  weight = 3

[[menu.main]]
  name = "Business"
  url = "/categories/business/"
  weight = 4

[[menu.main]]
  name = "Infrastructure"
  url = "/categories/infrastructure/"
  weight = 5

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 6

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[pagination]
  pagerSize = 12
