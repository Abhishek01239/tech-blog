baseURL = "https://www.nexivo.org.in/"
locale = "en-us"
title = "Nexivo"
enableRobotsTXT = true

# Categories only. Tag pages were removed: 374 of 469 tags held a single post,
# which added hundreds of near-empty pages for crawlers to index.
[taxonomies]
  category = "categories"

[params]
  description = "Hands-on guides to AI engineering, automation, DevOps and security, built from real projects with tested code, by an independent student developer."
  author = "Jaiswar Abhishek"
  # Shown in bylines, the author box and structured data. Confirm the spelling.
  authorName = "Jaiswar Abhishek"
  authorUrl = "/about/"
  authorGithub = "https://github.com/Abhishek01239"
  github_repo = "https://github.com/Abhishek01239/tech-blog"
  contactEmail = "jaiswarabhishek12@gmail.com"
  # Google AdSense publisher ID, used for the verification meta tag and ads.txt.
  adsensePublisher = "ca-pub-1455389319625277"
  # Ad unit IDs from AdSense > Ads > By ad unit. Leave empty until units exist;
  # ad slots render nothing while empty, so no empty boxes appear on the site.
  adsenseSlotArticle = "5005825680"
  adsenseSlotSidebar = "2950507980"
  # Search Console ownership token (HTML tag method). Empty = no meta tag emitted.
  googleSiteVerification = ""
  # GA4 measurement ID (G-XXXXXXXXXX). Empty = no analytics script at all.
  ga4MeasurementId = ""

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[outputs]
  home = ["HTML", "RSS"]

[sitemap]
  changefreq = "weekly"
  priority = 0.5

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "AI"
  url = "/categories/ai/"
  weight = 2

[[menu.main]]
  name = "Automation"
  url = "/categories/automation/"
  weight = 3

[[menu.main]]
  name = "DevOps"
  url = "/categories/devops/"
  weight = 4

[[menu.main]]
  name = "Cybersecurity"
  url = "/categories/cybersecurity/"
  weight = 5

[[menu.main]]
  name = "Vulnerability Watch"
  url = "/vuln-watch/"
  weight = 6

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 7

[caches]
  [caches.images]
    dir = ":cacheDir/images"

[pagination]
  pagerSize = 12
